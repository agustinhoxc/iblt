<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Símbolo IBLT — Grafo Austral">
  <!--
    GRAFO AUSTRAL — símbolo do Instituto Brasileiro de Liderança Tecnológica
    Leitura 1: um grafo — rede inteligente, pensamento sistêmico.
    Leitura 2: o Cruzeiro do Sul — cada nó na posição de uma estrela,
               com raio proporcional à magnitude real (Acrux, a mais
               brilhante, é o maior nó).
    Leitura 3: os eixos se cruzam no ponto áureo do eixo principal (38,2%);
               Ginan, a quinta estrela, ocupa o segundo ponto áureo (61,8%).
    Construção monocromática. Usa currentColor: herda a cor do contexto.
  -->
  <g stroke="currentColor" stroke-linecap="round" fill="none">
    <!-- eixos principais (o cruzamento em 62.79, 49.62 = seção áurea) -->
    <line x1="60.5" y1="16"   x2="66.5"  y2="104"  stroke-width="2"/>
    <line x1="19.5" y1="56.8" x2="101.5" y2="43.2" stroke-width="2"/>
    <!-- vetores de rede (ligam a quinta estrela ao sistema) -->
    <line x1="66.5" y1="104"  x2="77.2"  y2="70.4" stroke-width="1.1"/>
    <line x1="77.2" y1="70.4" x2="101.5" y2="43.2" stroke-width="1.1"/>
  </g>
  <g fill="currentColor">
    <circle cx="66.5"  cy="104"  r="5.4"/> <!-- α Acrux   · mag 0.77 -->
    <circle cx="19.5"  cy="56.8" r="4.7"/> <!-- β Mimosa  · mag 1.25 -->
    <circle cx="60.5"  cy="16"   r="4.2"/> <!-- γ Gacrux  · mag 1.64 -->
    <circle cx="101.5" cy="43.2" r="3.6"/> <!-- δ Imai    · mag 2.79 -->
    <circle cx="77.2"  cy="70.4" r="2.6"/> <!-- ε Ginan   · mag 3.59 -->
  </g>
</svg>
